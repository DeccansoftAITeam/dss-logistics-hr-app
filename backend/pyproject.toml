[project]
name = "dss-ask-policy-backend"
version = "1.0.0"
description = "DSS Ask Policy backend API & RAG engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29.0",
  "pgvector>=0.3.0",
  "alembic>=1.13.2",
  "pydantic-settings>=2.5.2",
  "httpx>=0.27.2",
  "openai>=1.50.0",
  "azure-storage-blob>=12.20.0",
  "pyjwt[crypto]>=2.9.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=5.0.0",
  "archunitpython>=1.7.0",
  "ruff>=0.6.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
