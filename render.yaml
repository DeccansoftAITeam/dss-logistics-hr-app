# Render Blueprint — DSS Ask Policy
#
# One-click deploy: https://render.com/deploy?repo=<your-fork-url>
#
# Participants: click the button, connect your own GitHub/Render account, fill in
# the secrets when prompted, and Render creates YOUR OWN web + api + database.
#
# Required to click: nothing. The app boots in demo mode without external
# credentials and provisions its own schema + policy library on first boot.
#
# Optional (enables live AI answers): your own Azure OpenAI resource.
# Admin access: set ADMIN_BOOTSTRAP_EMAIL to YOUR email; the first sign-in with
# that email is auto-promoted to a verified Admin.

services:
  - type: web
    name: dss-ask-policy-web
    runtime: node
    plan: free
    buildCommand: pnpm install --prod=false --no-frozen-lockfile && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_SIGN_IN_URL
        value: /sign-in
      - key: NEXT_PUBLIC_CLERK_SIGN_UP_URL
        value: /sign-up
      - key: CLERK_ORG_ID
        sync: false
      # Backend URL is wired automatically via Render private networking —
      # participants never type their API URL anywhere. (INTERNAL_BACKEND_URL /
      # NEXT_PUBLIC_API_BASE_URL, if set manually, still win as overrides.)
      - key: BACKEND_PRIVATE_HOST
        fromService:
          name: ask-policy-api
          type: web
          property: host
      - key: BACKEND_PRIVATE_PORT
        fromService:
          name: ask-policy-api
          type: web
          property: port

  - type: web
    name: ask-policy-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -e .
    # The in-app one-time bootstrap provisions schema + corpus on first boot.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ask-policy-db
          property: connectionString
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: AZURE_OPENAI_CHAT_DEPLOYMENT
        value: gpt-5.6-luna
      - key: AZURE_OPENAI_EMBEDDING_DEPLOYMENT
        value: text-embedding-3-large
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false
      - key: AZURE_STORAGE_CONTAINER
        value: dss-ask-policy-content
      - key: CLERK_JWKS_URL
        sync: false
      - key: CLERK_ORG_ID
        sync: false
      - key: JIRA_SITE_URL
        sync: false
      - key: JIRA_PROJECT_KEY
        value: HRSD
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false

databases:
  - name: ask-policy-db
    plan: free
    databaseName: ask_policy
    user: ask_policy_user